<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include meta-tags.html %}
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | absolute_url }}">{{ site.title }}</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <!-- h-card: IndieWeb identity markup -->
    <div class="h-card" style="display:none;">
      <a class="p-name u-url" href="{{ site.url }}">{{ site.author.name }}</a>
      <a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
    </div>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </footer>
</body>
</html>
